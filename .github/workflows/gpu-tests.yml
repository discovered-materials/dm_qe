# GPU tests: the gate for pull requests into develop.
#
#   cpu-build    GitHub-hosted: the tree must build without CUDA (gfortran, Open MPI, FFTW, OpenBLAS)
#                and pass two quick test directories.
#   start-runner GitHub-hosted: starts the GPU runner VM in our Google Cloud project (a self-hosted
#                runner labelled gpu + dm-qe; it shuts itself down when idle). Needs the repository
#                secret GCP_SA_KEY and the variables GPU_RUNNER_VM / GPU_RUNNER_ZONE / GCP_PROJECT;
#                without them the job is skipped and gpu-tests waits for whatever runner is online.
#   gpu-tests    self-hosted GPU runner: GPU build with the published flags, then the QE test-suite
#                categories in CI_CATEGORIES (pw_all ph_all, one per GPU, about an hour on two A100s), compared with
#                .github/ci/known-failures.txt: a test that fails and is not on the list fails the job.
#
# .github/ci/README.md: the runner, the secrets, the known-failure list, branch protection.
name: GPU tests
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      categories:
        description: test-suite categories (space separated)
        default: pw_all ph_all
  schedule:
    - cron: '23 5 * * 1'     # weekly, so the self-hosted runner never goes 14 days without connecting
concurrency:
  group: gpu-tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI_CATEGORIES: ${{ github.event.inputs.categories || 'pw_all ph_all' }}
jobs:
  cpu-build:
    name: CPU-only build and quick tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential gfortran libopenmpi-dev openmpi-bin \
            libfftw3-dev libopenblas-dev cmake python3 > /dev/null
      - name: Build pw.x and ph.x (gfortran)
        run: BUILD_JOBS=4 gpu-quickstart/scripts/build.sh . build/cpu cpu-gnu pw ph
      - name: Quick tests (pw_scf, ph_base)
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run: |
          CI_BUILD_DIR=$PWD/build/cpu CI_FLAVOR=cpu CI_CATEGORIES="pw_scf ph_base" CI_SKIP_BUILD=1 bash .github/ci/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cpu-test-logs, path: ci-logs/, if-no-files-found: ignore }

  start-runner:
    name: Start the GPU runner VM
    runs-on: ubuntu-latest
    # self-hosted runners and secrets are for branches of this repository, not for forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      started: ${{ steps.start.outputs.started }}
    steps:
      - id: start
        env:
          HAVE_KEY: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" != true ]; then echo "no GCP_SA_KEY: not starting a VM, waiting for an online runner"; echo "started=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "started=yes" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        if: steps.start.outputs.started == 'yes'
        with: { credentials_json: '${{ secrets.GCP_SA_KEY }}' }
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.start.outputs.started == 'yes'
      - name: gcloud compute instances start
        if: steps.start.outputs.started == 'yes'
        env:
          VM: ${{ vars.GPU_RUNNER_VM || 'dmqe-ci-a100' }}
          ZONE: ${{ vars.GPU_RUNNER_ZONE || 'us-central1-c' }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          # GPU capacity comes and goes: the preferred machine type (two A100s, one test-suite category
          # per GPU, about an hour) first, the fallback (one A100, about two hours) when the zone has
          # no such machine free, retried for about 25 minutes
          PREFERRED: ${{ vars.GPU_RUNNER_MACHINE_TYPE || 'a2-highgpu-2g' }}
          FALLBACK: ${{ vars.GPU_RUNNER_FALLBACK_TYPE || 'a2-highgpu-1g' }}
        run: |
          [ -n "$PROJECT" ] && gcloud config set project "$PROJECT"
          state() { gcloud compute instances describe "$VM" --zone "$ZONE" --format='value(status)'; }
          mtype() { gcloud compute instances describe "$VM" --zone "$ZONE" --format='value(machineType.basename())'; }
          echo "$VM is $(state), $(mtype)"
          case "$(state)" in STOPPING|SUSPENDING|STAGING|PROVISIONING|REPAIRING) sleep 90 ;; esac
          for attempt in $(seq 1 10); do
            for mt in "$PREFERRED" "$FALLBACK"; do
              [ "$(state)" = RUNNING ] && break 2
              if [ "$(mtype)" != "$mt" ]; then
                gcloud compute instances set-machine-type "$VM" --zone "$ZONE" --machine-type "$mt" --quiet || true
              fi
              if gcloud compute instances start "$VM" --zone "$ZONE" --quiet 2> start.err; then
                echo "started $VM as $mt"; break 2
              fi
              grep -q -E "RESOURCE_POOL_EXHAUSTED|STOCKOUT|not enough resources" start.err \
                && echo "no capacity for $mt in $ZONE (attempt $attempt)" || { cat start.err; exit 1; }
            done
            sleep 120
          done
          [ "$(state)" = RUNNING ] || { echo "could not start $VM: no GPU capacity in $ZONE for $PREFERRED or $FALLBACK; re-run the workflow later"; exit 1; }
          echo "$VM is $(state), $(mtype)"

  gpu-tests:
    name: GPU build and test-suite
    needs: start-runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu, dm-qe]
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: GPU build and test-suite
        run: bash .github/ci/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gpu-test-logs, path: ci-logs/, if-no-files-found: ignore }
